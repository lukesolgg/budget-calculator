<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Budget Calculator</title>
<style>
  :root {
    --bg: #0b0f17;
    --panel: #111722;
    --panel-2: #161d2b;
    --border: #232c3d;
    --text: #f4efe6;
    --muted: #8b97a8;
    --track: #1c2433;
    --accent: #4ea8ff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(900px 600px at 80% -10%, #13203a 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .wrap {
    max-width: 1240px;
    margin: 0 auto;
    padding: 32px 24px 64px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 12px;
  }

  h1 {
    font-size: 22px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  h1 span { color: var(--accent); }

  .tagline { color: var(--muted); font-size: 14px; margin-top: 4px; }

  .btn-export {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(180deg, #3b86ff 0%, #246cf0 100%);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(36, 108, 240, 0.35);
    transition: filter .15s, transform .05s;
  }
  .btn-export:hover { filter: brightness(1.08); }
  .btn-export:active { transform: translateY(1px); }
  .btn-export:disabled { opacity: .6; cursor: default; }

  .layout {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 28px;
    align-items: start;
  }

  .card {
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
  }

  .income-block { margin-bottom: 18px; }
  label.field-label {
    display: block;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .money-input {
    position: relative;
  }
  .money-input::before {
    content: "£";
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 15px;
  }
  .money-input input {
    width: 100%;
    background: #0c121d;
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    padding: 12px 14px 12px 28px;
    font-size: 16px;
    outline: none;
    transition: border-color .15s;
  }
  .money-input input:focus { border-color: var(--accent); }

  .income-input input { font-size: 20px; font-weight: 600; }

  .rows { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }

  .row {
    display: grid;
    grid-template-columns: 14px 1fr 120px;
    align-items: center;
    gap: 10px;
  }
  .dot {
    width: 13px; height: 13px; border-radius: 4px;
  }
  .row .name { font-size: 14px; color: var(--text); }
  .row .money-input input { padding: 9px 12px 9px 26px; font-size: 14px; }
  .row .money-input::before { font-size: 13px; }

  .chart-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 680px;
    justify-content: center;
    min-width: 0; /* allow the column to shrink so the donut can cap at 100% */
  }

  .donut-wrap { position: relative; width: 525px; max-width: 100%; }
  svg { width: 100%; height: auto; display: block; }

  .center-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .center-text .amount {
    font-size: 64px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .center-text .label { color: var(--muted); font-size: 24px; margin-top: 6px; }

  .summary {
    display: flex;
    gap: 28px;
    margin-top: 26px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .summary .stat { text-align: center; }
  .summary .stat .v { font-size: 22px; font-weight: 700; }
  .summary .stat .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-top: 4px; }
  .leftover.pos .v { color: #4ade80; }
  .leftover.neg .v { color: #f87171; }

  .legend-pct { color: var(--muted); font-size: 12px; margin-left: 6px; }

  @media (max-width: 880px) {
    .layout { grid-template-columns: 1fr; }
    .donut-wrap { width: 320px; }
    .center-text .amount { font-size: 40px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Budget <span>Calculator</span></h1>
        <div class="tagline">Enter your income and expenses to see where your money goes.</div>
      </div>
      <button id="exportBtn" class="btn-export" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span id="exportLabel">Export</span>
      </button>
    </header>

    <div class="layout">
      <!-- Inputs -->
      <section class="card">
        <div class="income-block">
          <label class="field-label" for="income">Monthly Income</label>
          <div class="money-input income-input">
            <input id="income" type="number" inputmode="decimal" min="0" placeholder="0" value="6100" />
          </div>
        </div>

        <label class="field-label">Expenses</label>
        <div class="rows" id="rows"></div>
      </section>

      <!-- Chart -->
      <section class="card chart-card">
        <div class="donut-wrap">
          <svg id="donut" viewBox="0 0 200 200"></svg>
          <div class="center-text">
            <div class="amount" id="center-amount">$0</div>
            <div class="label">Monthly Income</div>
          </div>
        </div>

        <div class="summary">
          <div class="stat">
            <div class="v" id="sum-income">$0</div>
            <div class="k">Income</div>
          </div>
          <div class="stat">
            <div class="v" id="sum-expenses">$0</div>
            <div class="k">Expenses</div>
          </div>
          <div class="stat leftover" id="leftover-stat">
            <div class="v" id="sum-leftover">$0</div>
            <div class="k">Leftover</div>
          </div>
        </div>
      </section>
    </div>
  </div>

<script>
  const CATEGORIES = [
    { key: "debt",         name: "Debt",          color: "#4cb8f0", value: 1214 },
    { key: "rent",         name: "Rent",          color: "#f0556f", value: 1430 },
    { key: "utilities",    name: "Utilities",     color: "#46d17f", value: 330 },
    { key: "phone",        name: "Phone",         color: "#f2932f", value: 180 },
    { key: "gas",          name: "Gas",           color: "#9b6bf2", value: 400 },
    { key: "carInsurance", name: "Car Insurance", color: "#2fd6b0", value: 284 },
    { key: "food",         name: "Food",          color: "#ef4444", value: 600 },
    { key: "tpFund",       name: "TP Fund",       color: "#e6c43c", value: 200 },
    { key: "medical",      name: "Medical",       color: "#d2691e", value: 80 },
    { key: "subscriptions",name: "Subscriptions", color: "#c04bd6", value: 80 },
    { key: "petInsurance", name: "Pet Insurance", color: "#4f6bf0", value: 50 },
    { key: "petFood",      name: "Pet Food",      color: "#5fd66f", value: 40 },
  ];

  const SVGNS = "http://www.w3.org/2000/svg";
  const rowsEl = document.getElementById("rows");
  const donut = document.getElementById("donut");
  const incomeEl = document.getElementById("income");

  const fmt = (n) => (n < 0 ? "-£" : "£") + Math.abs(Math.round(n)).toLocaleString("en-GB");

  // --- colour helpers for segment gradients ---
  const hexToRgb = (h) => {
    h = h.replace("#", "");
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  };
  const mix = (rgb, target, t) => rgb.map((c, i) => Math.round(c + (target[i] - c) * t));
  const rgbStr = (rgb) => `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
  const lighten = (hex, t) => rgbStr(mix(hexToRgb(hex), [255, 255, 255], t));
  const darken = (hex, t) => rgbStr(mix(hexToRgb(hex), [0, 0, 0], t));

  // Build input rows
  CATEGORIES.forEach((c) => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <span class="dot" style="background:${c.color}"></span>
      <span class="name">${c.name}</span>
      <span class="money-input">
        <input type="number" inputmode="decimal" min="0" data-key="${c.key}" value="${c.value}" placeholder="0" />
      </span>`;
    rowsEl.appendChild(row);
  });

  function getValues() {
    const vals = {};
    rowsEl.querySelectorAll("input").forEach((inp) => {
      vals[inp.dataset.key] = Math.max(0, parseFloat(inp.value) || 0);
    });
    return vals;
  }

  function render() {
    const income = Math.max(0, parseFloat(incomeEl.value) || 0);
    const vals = getValues();
    const items = CATEGORIES
      .map((c) => ({ ...c, value: vals[c.key] }))
      .filter((c) => c.value > 0);

    const totalExpenses = items.reduce((s, c) => s + c.value, 0);
    const leftover = income - totalExpenses;

    // center + summary
    document.getElementById("center-amount").textContent = fmt(income);
    document.getElementById("sum-income").textContent = fmt(income);
    document.getElementById("sum-expenses").textContent = fmt(totalExpenses);
    document.getElementById("sum-leftover").textContent = fmt(leftover);
    const lo = document.getElementById("leftover-stat");
    lo.classList.toggle("pos", leftover >= 0);
    lo.classList.toggle("neg", leftover < 0);

    drawDonut(items, income, totalExpenses);
  }

  function drawDonut(items, income, totalExpenses) {
    while (donut.firstChild) donut.removeChild(donut.firstChild);

    const cx = 100, cy = 100, r = 78, stroke = 18;
    const circ = 2 * Math.PI * r;
    const gapDeg = 3.6; // visible gap between segments

    // The full ring represents income. Expenses fill it proportionally and
    // any leftover is left undrawn. If expenses exceed income, the ring fills
    // completely (overspending).
    const total = Math.max(income, totalExpenses);
    if (total <= 0) return;

    // --- defs: a soft drop shadow (lifts segments off the ring) and a glossy
    // radial gradient per colour (brighter shine on the inner edge). The band
    // spans radius [r - stroke/2, r + stroke/2]; the gradient is concentric so
    // the highlight sits on the inner edge of every segment.
    const defs = document.createElementNS(SVGNS, "defs");

    const filter = document.createElementNS(SVGNS, "filter");
    filter.setAttribute("id", "segShadow");
    filter.setAttribute("x", "-30%");
    filter.setAttribute("y", "-30%");
    filter.setAttribute("width", "160%");
    filter.setAttribute("height", "160%");
    // Near-omnidirectional soft shadow (tiny downward bias) so each segment
    // appears lifted on every side, not just where the gaps reveal the ring.
    const ds = document.createElementNS(SVGNS, "feDropShadow");
    ds.setAttribute("dx", "0");
    ds.setAttribute("dy", "0.6");
    ds.setAttribute("stdDeviation", "2.2");
    ds.setAttribute("flood-color", "#000000");
    ds.setAttribute("flood-opacity", "0.6");
    filter.appendChild(ds);
    defs.appendChild(filter);

    const rOuter = r + stroke / 2;
    const innerOff = (r - stroke / 2) / rOuter; // band inner edge as gradient offset
    items.forEach((c) => {
      const g = document.createElementNS(SVGNS, "radialGradient");
      g.setAttribute("id", `grad-${c.key}`);
      g.setAttribute("gradientUnits", "userSpaceOnUse");
      g.setAttribute("cx", cx);
      g.setAttribute("cy", cy);
      g.setAttribute("r", rOuter);
      // Subtle: a slightly lighter shade of the same colour on the inner edge,
      // easing to the base colour and a touch darker on the outer edge.
      const stops = [
        [innerOff,                        lighten(c.color, 0.20)], // lighter shade
        [innerOff + (1 - innerOff) * 0.5, c.color],
        [1,                               darken(c.color, 0.12)],  // slightly shaded edge
      ];
      stops.forEach(([off, col]) => {
        const s = document.createElementNS(SVGNS, "stop");
        s.setAttribute("offset", off);
        s.setAttribute("stop-color", col);
        g.appendChild(s);
      });
      defs.appendChild(g);
    });
    donut.appendChild(defs);

    // Outer border ring around the whole circle, slightly wider than the
    // colored segments so it reads as a clean bordered band.
    const border = document.createElementNS(SVGNS, "circle");
    border.setAttribute("cx", cx);
    border.setAttribute("cy", cy);
    border.setAttribute("r", r);
    border.setAttribute("fill", "none");
    border.setAttribute("stroke", "#2c3547");
    border.setAttribute("stroke-width", stroke + 8);
    donut.appendChild(border);

    // Inner dark track (the empty/leftover portion shows as this).
    const track = document.createElementNS(SVGNS, "circle");
    track.setAttribute("cx", cx);
    track.setAttribute("cy", cy);
    track.setAttribute("r", r);
    track.setAttribute("fill", "none");
    track.setAttribute("stroke", "#1b2230");
    track.setAttribute("stroke-width", stroke);
    donut.appendChild(track);

    // Each category is drawn as an annular-sector tile, then given a thin
    // same-colour outline (linejoin/linecap round) for a slight corner round.
    // The tile is inset by half that outline so its size stays accurate.
    const DEG = Math.PI / 180;
    const ptT = (radius, deg) => [
      cx + radius * Math.cos((-90 + deg) * DEG),
      cy + radius * Math.sin((-90 + deg) * DEG),
    ];
    const n3 = (v) => Math.round(v * 1000) / 1000;

    const cornerStroke = 3;             // thin outline -> slight rounding
    const rh = cornerStroke / 2;
    const angInset = rh / r / DEG;      // degrees to pull ends in by
    const roUse = r + stroke / 2 - rh;  // outer radius (inset)
    const riUse = r - stroke / 2 + rh;  // inner radius (inset)
    const minDeg = 2.4;                 // minimum visible tile width
    const minSlot = minDeg + gapDeg;    // guarantees a tile AND a full gap fit

    // Give each category an angular slot. Tiny categories get a minimum slot
    // so they stay visible and keep a real gap; the extra angle is borrowed
    // from larger categories in proportion to their spare room. This keeps the
    // gap consistent all the way round (no bunching of the small ones).
    const expDeg = items.reduce((s, c) => s + (c.value / total) * 360, 0);
    const slots = items.map((c) => ({
      c,
      frac: c.value / total,
      slot: Math.max((c.value / total) * 360, minSlot),
    }));
    let excess = slots.reduce((s, x) => s + x.slot, 0) - expDeg;
    if (excess > 0) {
      const headroom = slots.reduce((s, x) => s + Math.max(0, x.slot - minSlot), 0);
      if (headroom > 0) {
        slots.forEach((x) => {
          x.slot -= excess * (Math.max(0, x.slot - minSlot) / headroom);
        });
      }
    }

    let startDeg = 0; // cumulative degrees from the top, clockwise
    slots.forEach(({ c, frac, slot }) => {
      const a0 = startDeg + gapDeg / 2;
      const a1 = startDeg + slot - gapDeg / 2;
      let b0 = a0 + angInset;
      let b1 = a1 - angInset;
      if (b1 <= b0) { const m = (a0 + a1) / 2; b0 = m - 0.25; b1 = m + 0.25; }

      const [ox0, oy0] = ptT(roUse, b0);
      const [ox1, oy1] = ptT(roUse, b1);
      const [ix1, iy1] = ptT(riUse, b1);
      const [ix0, iy0] = ptT(riUse, b0);
      const large = b1 - b0 > 180 ? 1 : 0;

      const d = [
        `M ${n3(ox0)} ${n3(oy0)}`,
        `A ${n3(roUse)} ${n3(roUse)} 0 ${large} 1 ${n3(ox1)} ${n3(oy1)}`,
        `L ${n3(ix1)} ${n3(iy1)}`,
        `A ${n3(riUse)} ${n3(riUse)} 0 ${large} 0 ${n3(ix0)} ${n3(iy0)}`,
        "Z",
      ].join(" ");

      const seg = document.createElementNS(SVGNS, "path");
      seg.setAttribute("d", d);
      seg.setAttribute("fill", `url(#grad-${c.key})`);
      seg.setAttribute("stroke", `url(#grad-${c.key})`);
      seg.setAttribute("stroke-width", cornerStroke);
      seg.setAttribute("stroke-linejoin", "round");
      seg.setAttribute("stroke-linecap", "round");
      seg.setAttribute("filter", "url(#segShadow)"); // lifted off the ring

      const title = document.createElementNS(SVGNS, "title");
      title.textContent = `${c.name}: ${fmt(c.value)} (${(frac * 100).toFixed(1)}%)`;
      seg.appendChild(title);

      donut.appendChild(seg);
      startDeg += slot;
    });
  }

  // listeners
  incomeEl.addEventListener("input", render);
  rowsEl.addEventListener("input", render);
  render();

  // --- Export to PNG ---------------------------------------------------------
  const xmlEsc = (s) => String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  function currentState() {
    const income = Math.max(0, parseFloat(incomeEl.value) || 0);
    const vals = getValues();
    const items = CATEGORIES
      .map((c) => ({ name: c.name, color: c.color, value: vals[c.key] }))
      .filter((c) => c.value > 0);
    const totalExpenses = items.reduce((s, c) => s + c.value, 0);
    return { income, items, totalExpenses, leftover: income - totalExpenses };
  }

  function buildExportSvg() {
    const { income, items, totalExpenses, leftover } = currentState();
    const total = Math.max(income, totalExpenses);
    const W = 1100, H = 720;
    const FONT = "-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif";
    const dateStr = new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });

    // Embed a copy of the live donut chart, positioned and sized.
    const donutClone = donut.cloneNode(true);
    donutClone.removeAttribute("id");
    donutClone.setAttribute("x", 60);
    donutClone.setAttribute("y", 150);
    donutClone.setAttribute("width", 470);
    donutClone.setAttribute("height", 470);
    const donutMarkup = new XMLSerializer().serializeToString(donutClone);
    const dcx = 60 + 235, dcy = 150 + 235;

    // Legend / breakdown rows on the right.
    const lx = 600, xr = W - 48, rowH = 31;
    let ly = 188;
    let rows = `<text x="${lx}" y="158" font-size="13" letter-spacing="1.5" fill="#8b97a8">EXPENSES</text>`;
    items.forEach((c) => {
      const pct = total > 0 ? (c.value / total * 100).toFixed(1) + "%" : "";
      rows +=
        `<rect x="${lx}" y="${ly - 12}" width="15" height="15" rx="4" fill="${c.color}"/>` +
        `<text x="${lx + 25}" y="${ly}" font-size="17" fill="#e8eef7">${xmlEsc(c.name)}</text>` +
        `<text x="${xr - 150}" y="${ly}" font-size="15" fill="#8b97a8" text-anchor="end">${pct}</text>` +
        `<text x="${xr}" y="${ly}" font-size="17" font-weight="600" fill="#f4efe6" text-anchor="end">${fmt(c.value)}</text>`;
      ly += rowH;
    });

    // Summary row.
    const sy = H - 96;
    const loColor = leftover >= 0 ? "#4ade80" : "#f87171";
    const stat = (x, val, label, color) =>
      `<text x="${x}" y="${sy}" font-size="24" font-weight="700" fill="${color}">${val}</text>` +
      `<text x="${x}" y="${sy + 20}" font-size="12" letter-spacing="1" fill="#8b97a8">${label}</text>`;
    const summary =
      `<line x1="${lx}" y1="${sy - 34}" x2="${xr}" y2="${sy - 34}" stroke="#232c3d"/>` +
      stat(lx, fmt(income), "INCOME", "#f4efe6") +
      stat(lx + 170, fmt(totalExpenses), "EXPENSES", "#f4efe6") +
      stat(lx + 340, fmt(leftover), "LEFTOVER", loColor);

    const svg =
`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="${FONT}">
  <rect width="${W}" height="${H}" fill="#0b0f17"/>
  <rect x="16" y="16" width="${W - 32}" height="${H - 32}" rx="24" fill="#121826" stroke="#232c3d"/>
  <text x="48" y="74" font-size="32" font-weight="700" fill="#f4efe6">Budget <tspan fill="#4ea8ff">Calculator</tspan></text>
  <text x="${W - 48}" y="74" font-size="16" fill="#8b97a8" text-anchor="end">${dateStr}</text>
  <line x1="48" y1="100" x2="${W - 48}" y2="100" stroke="#232c3d"/>
  ${donutMarkup}
  <text x="${dcx}" y="${dcy - 4}" text-anchor="middle" font-size="44" font-weight="700" fill="#f4efe6">${fmt(income)}</text>
  <text x="${dcx}" y="${dcy + 24}" text-anchor="middle" font-size="19" fill="#8b97a8">Monthly Income</text>
  ${rows}
  ${summary}
</svg>`;
    return { svg, W, H };
  }

  function exportPng() {
    const btn = document.getElementById("exportBtn");
    const label = document.getElementById("exportLabel");
    btn.disabled = true;
    const prev = label.textContent;
    label.textContent = "Exporting…";

    const { svg, W, H } = buildExportSvg();
    const scale = 2; // crisp, print-friendly resolution
    const img = new Image();
    const blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(blob);

    const done = () => { btn.disabled = false; label.textContent = prev; };

    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = W * scale;
      canvas.height = H * scale;
      const ctx = canvas.getContext("2d");
      ctx.scale(scale, scale);
      ctx.drawImage(img, 0, 0, W, H);
      URL.revokeObjectURL(url);
      canvas.toBlob((png) => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(png);
        a.download = `budget-${new Date().toISOString().slice(0, 10)}.png`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        done();
      }, "image/png");
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      done();
      alert("Sorry, the export failed. Please try again.");
    };
    img.src = url;
  }

  document.getElementById("exportBtn").addEventListener("click", exportPng);
</script>
</body>
</html>
